<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ao Li profile banner">
  <rect width="1200" height="360" rx="26" fill="#f8fafc"/>
  <rect x="36" y="36" width="1128" height="288" rx="24" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="78" y="104" fill="#0f172a" font-size="42" font-weight="700">Ao Li</text>
    <text x="78" y="142" fill="#475569" font-size="20">Tactile robotics | neuromorphic touch | embodied intelligence</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="78" y="188" width="206" height="58" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="181" y="213" text-anchor="middle" fill="#075985" font-size="15" font-weight="700">Tactile Sensing</text>
    <text x="181" y="235" text-anchor="middle" fill="#334155" font-size="13">contact | force | speed</text>

    <rect x="314" y="188" width="206" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="417" y="213" text-anchor="middle" fill="#166534" font-size="15" font-weight="700">Neuromorphic Touch</text>
    <text x="417" y="235" text-anchor="middle" fill="#334155" font-size="13">events | texture | motion</text>

    <rect x="550" y="188" width="206" height="58" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="653" y="213" text-anchor="middle" fill="#854d0e" font-size="15" font-weight="700">Embodied AI</text>
    <text x="653" y="235" text-anchor="middle" fill="#334155" font-size="13">perception -> action</text>

    <rect x="786" y="188" width="206" height="58" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="889" y="213" text-anchor="middle" fill="#334155" font-size="15" font-weight="700">Research Tools</text>
    <text x="889" y="235" text-anchor="middle" fill="#334155" font-size="13">notes | plots | scripts</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M181 260 C181 292 417 292 417 260"/>
    <path d="M417 260 C417 302 653 302 653 260"/>
    <path d="M653 260 C653 292 889 292 889 260"/>
  </g>

  <text x="78" y="302" fill="#64748b" font-family="Menlo, Consolas, monospace" font-size="15">contact -> signal -> perception -> action</text>
